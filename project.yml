name: Daymark
options:
  bundleIdPrefix: systems.edmundlim
  deploymentTarget:
    iOS: '27.3'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Daymark
    CODE_SIGN_STYLE: Automatic
targets:
  Daymark:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.edmundlim.daymark
schemes:
  Daymark:
    build:
      targets:
        Daymark: all
    run:
      config: Debug
