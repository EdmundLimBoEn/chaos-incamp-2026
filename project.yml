name: sstincky calander
options:
  bundleIdPrefix: systems.edmundlim
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: sstincky calander
    INFOPLIST_KEY_NSAlarmKitUsageDescription: Schedule alarms you create, even when this app is closed.
    CODE_SIGN_STYLE: Automatic
targets:
  sstincky calander:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.edmundlim.daymark
schemes:
  sstincky calander:
    build:
      targets:
        sstincky calander: all
    run:
      config: Debug
