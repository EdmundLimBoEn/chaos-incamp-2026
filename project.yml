name: sstincky calander
options:
  bundleIdPrefix: systems.edmundlim
  deploymentTarget:
    iOS: '26.3'
settings:
  base:
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '1.0'
    INFOPLIST_KEY_CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
    INFOPLIST_KEY_CFBundleShortVersionString: '$(MARKETING_VERSION)'
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: sstincky calander
    INFOPLIST_KEY_NSAlarmKitUsageDescription: Schedule alarms you create, even when this app is closed.
    CODE_SIGN_STYLE: Automatic
targets:
  sstincky calander:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    info:
      path: Config/App-Info.plist
      properties:
        NSAlarmKitUsageDescription: Schedule alarms you create, even when this app is closed.
    dependencies:
      - target: CalendarWidget
        embed: true
    entitlements:
      path: Config/Calendar.entitlements
      properties:
        com.apple.security.application-groups: [group.systems.edmundlim.daymark]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.edmundlim.daymark
  CalendarWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
      - Sources/CalendarEvent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.edmundlim.daymark.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: sstincky calander
    info:
      path: Config/Widget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.systems.edmundlim.daymark]
schemes:
  sstincky calander:
    build:
      targets:
        sstincky calander: all
    run:
      config: Debug
